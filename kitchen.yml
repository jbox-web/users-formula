# -*- coding: utf-8 -*-
# vim: ft=yaml
---
# For help on this file's format, see https://kitchen.ci/
driver:
  name: docker
  use_sudo: false
  privileged: true
  run_command: /usr/lib/systemd/systemd

provisioner:
  name: salt_solo
  log_level: debug
  salt_install: none
  require_chef: false
  formula: users
  salt_copy_filter:
    - .kitchen
    - .git

platforms:
  - name: debian-13-3008-2
    driver:
      image: saltimages/salt-3008.2-py3:debian-13
      run_command: /lib/systemd/systemd
  - name: debian-13-3006-27
    driver:
      image: saltimages/salt-3006.27-py3:debian-13
      run_command: /lib/systemd/systemd
  - name: debian-11-3006-27
    driver:
      image: saltimages/salt-3006.27-py3:debian-11
      run_command: /lib/systemd/systemd

verifier:
  # https://www.inspec.io/
  name: inspec
  sudo: true
  reporter:
    # cli, documentation, html, progress, json, json-min, json-rspec, junit
    - cli

suites:
  - name: default
    provisioner:
      state_top:
        base:
          '*':
            - users._mapdata
            - users
      pillars:
        top.sls:
          base:
            '*':
              - users
      pillars_from_files:
        users.sls: test/salt/pillar/default.sls
    verifier:
      inspec_tests:
        - path: test/integration/default
  - name: vimrc
    provisioner:
      dependencies:
        - name: vim
          repo: git
          source: https://github.com/saltstack-formulas/vim-formula.git
      state_top:
        base:
          '*':
            - users._mapdata
            - users.vimrc
      pillars:
        top.sls:
          base:
            '*':
              - users
              - vimrc
      pillars_from_files:
        users.sls: test/salt/pillar/default.sls
        vimrc.sls: test/salt/pillar/vimrc.sls
    verifier:
      inspec_tests:
        - path: test/integration/default
        - path: test/integration/vimrc
